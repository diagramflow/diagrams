[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diagrams"
version = "1.0.0"
description = "Diagram as Code"
authors = [{ name = "mingrammer", email = "mingrammer@gmail.com" }]
maintainers = [{ name = "DiagramFlow Maintainers" }]
requires-python = "~=3.9"
readme = "README.md"
license = "MIT"
dependencies = [
    "graphviz>=0.13.2,<0.22.0",
    "jinja2>=2.10,<4.0",
    "typed-ast>=1.5.5,<2 ; python_version<'3.8'",
    "pre-commit>=4.0.1,<5",
]

[project.scripts]
diagrams = "diagrams.cli:main"

[project.urls]
Homepage = "https://github.com/diagramflow/diagrams"
Repository = "https://github.com/diagramflow/diagrams"
Upstream = "https://github.com/mingrammer/diagrams"

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pillow>=11,<13",
    "pylint>=3.3,<5.0",
    "rope~=1.13",
    "isort>=6,<10",
    "black>=24.4,<27.0",
]

[tool.hatch.build]
only-include = ["diagrams", "resources"]

[tool.black]
line-length=120
